COM_FOOTPRINT_STATS_ASK_TITLE="Dele anonym statistikk?"
COM_FOOTPRINT_STATS_ASK_DESC="Footprint kan sende anonym bruksstatistikk til utvikleren som hjelp til videre utvikling. Verken nettstedsnavn, URL eller e-post sendes — installasjonen identifiseres med en tilfeldig id. Det omfatter Joomla-, PHP- og databaseversjoner, noen diagnostiske innstillinger, størrelsene komponenten måler, samt en liste over dine installerte utvidelser og versjonene deres. Sendes høyst én gang i uken etter en skanning. Du kan endre dette senere under Innstillinger."
COM_FOOTPRINT_STATS_ASK_YES="Del anonym statistikk"
COM_FOOTPRINT_STATS_ASK_NO="Nei takk"
COM_FOOTPRINT_STATS_THANKS="Takk — anonym statistikk deles etter skanninger, høyst én gang i uken."
COM_FOOTPRINT_STATS_DECLINED="Ingen statistikk deles. Du blir ikke spurt igjen."
COM_FOOTPRINT_CONFIG_STATS_LABEL="Statistikk"
COM_FOOTPRINT_CONFIG_STATS_NOTE="Anonym bruksstatistikk hjelper med å avgjøre hva komponenten fortsatt må fungere sammen med. Verken nettstedsnavn, URL eller e-post sendes: installasjonen identifiseres med en tilfeldig id som endres hvis nettstedets URL endres. Sendes høyst én gang i uken etter en skanning, med kort tidsavbrudd, og aldri fra et nettsted som ikke har samtykket. Hele listen står i komponentens README."
COM_FOOTPRINT_CONFIG_STATS_CONSENT_LABEL="Del anonym statistikk"
COM_FOOTPRINT_CONFIG_STATS_CONSENT_DESC="Omfatter versjoner, diagnostiske innstillinger, målte størrelser og en liste over installerte utvidelser med versjoner."
