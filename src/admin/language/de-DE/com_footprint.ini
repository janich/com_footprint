COM_FOOTPRINT_STATS_ASK_TITLE="Anonyme Statistiken teilen?"
COM_FOOTPRINT_STATS_ASK_DESC="Footprint kann anonyme Nutzungsstatistiken an den Autor senden, um die Weiterentwicklung zu steuern. Es werden weder Website-Name, URL noch E-Mail gesendet — die Installation wird durch eine zufällige ID identifiziert. Enthalten sind Joomla-, PHP- und Datenbankversion, einige Diagnoseeinstellungen, die von der Komponente gemessenen Größen sowie eine Liste Ihrer installierten Erweiterungen und deren Versionen. Höchstens einmal pro Woche nach einem Scan. Später in den Optionen änderbar."
COM_FOOTPRINT_STATS_ASK_YES="Anonyme Statistiken teilen"
COM_FOOTPRINT_STATS_ASK_NO="Nein danke"
COM_FOOTPRINT_STATS_THANKS="Danke — anonyme Statistiken werden nach Scans geteilt, höchstens einmal pro Woche."
COM_FOOTPRINT_STATS_DECLINED="Es werden keine Statistiken geteilt. Sie werden nicht erneut gefragt."
COM_FOOTPRINT_CONFIG_STATS_LABEL="Statistiken"
COM_FOOTPRINT_CONFIG_STATS_NOTE="Anonyme Nutzungsstatistiken helfen zu entscheiden, womit die Komponente weiterhin funktionieren muss. Es werden weder Website-Name, URL noch E-Mail gesendet: Die Installation wird durch eine zufällige ID identifiziert, die sich ändert, wenn sich die URL ändert. Höchstens einmal pro Woche nach einem Scan, mit kurzem Timeout, und nie von einer Website ohne Zustimmung. Die vollständige Liste steht in der README der Komponente."
COM_FOOTPRINT_CONFIG_STATS_CONSENT_LABEL="Anonyme Statistiken teilen"
COM_FOOTPRINT_CONFIG_STATS_CONSENT_DESC="Enthält Versionen, Diagnoseeinstellungen, gemessene Größen und eine Liste installierter Erweiterungen mit Versionen."
COM_FOOTPRINT_CONFIG_STATS_UNASKED="Noch nicht beantwortet"
