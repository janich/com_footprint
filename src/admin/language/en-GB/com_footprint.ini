COM_FOOTPRINT_STATS_ASK_TITLE="Share anonymous statistics?"
COM_FOOTPRINT_STATS_ASK_DESC="Footprint can send anonymous usage statistics to its author to guide development. No site name, URL or e-mail is sent — the installation is identified by a random id. It includes your Joomla, PHP and database versions, a few diagnostic settings, the sizes this component measures, and a list of your installed extensions and their versions. Sent at most once a week, after a scan. You can change this later in Options."
COM_FOOTPRINT_STATS_ASK_YES="Share anonymous statistics"
COM_FOOTPRINT_STATS_ASK_NO="No thanks"
COM_FOOTPRINT_STATS_THANKS="Thank you — anonymous statistics will be shared after scans, at most once a week."
COM_FOOTPRINT_STATS_DECLINED="No statistics will be shared. You will not be asked again."
COM_FOOTPRINT_CONFIG_STATS_LABEL="Statistics"
COM_FOOTPRINT_CONFIG_STATS_NOTE="Anonymous usage statistics help decide what the component must keep working with. No site name, URL or e-mail is sent: the installation is identified by a random id that changes if the site URL changes. Sent at most once a week after a scan, with a short timeout, and never on a site that has not opted in. The full list of what is sent is in the component README."
COM_FOOTPRINT_CONFIG_STATS_CONSENT_LABEL="Share anonymous statistics"
COM_FOOTPRINT_CONFIG_STATS_CONSENT_DESC="Includes versions, diagnostic settings, measured sizes and a list of installed extensions with their versions."
COM_FOOTPRINT_CONFIG_STATS_UNASKED="Not answered yet"
