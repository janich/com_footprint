COM_FOOTPRINT_STATS_ASK_TITLE="Del anonym statistik?"
COM_FOOTPRINT_STATS_ASK_DESC="Footprint kan sende anonym brugsstatistik til udvikleren som hjælp til den videre udvikling. Der sendes hverken webstedsnavn, URL eller e-mail — installationen identificeres med et tilfældigt id. Det omfatter dine Joomla-, PHP- og databaseversioner, nogle få diagnostiske indstillinger, de størrelser komponenten måler, samt en liste over dine installerede udvidelser og deres versioner. Sendes højst én gang om ugen efter en scanning. Du kan ændre det senere under Indstillinger."
COM_FOOTPRINT_STATS_ASK_YES="Del anonym statistik"
COM_FOOTPRINT_STATS_ASK_NO="Nej tak"
COM_FOOTPRINT_STATS_THANKS="Tak — anonym statistik deles efter scanninger, højst én gang om ugen."
COM_FOOTPRINT_STATS_DECLINED="Der deles ingen statistik. Du bliver ikke spurgt igen."
COM_FOOTPRINT_CONFIG_STATS_LABEL="Statistik"
COM_FOOTPRINT_CONFIG_STATS_NOTE="Anonym brugsstatistik hjælper med at afgøre, hvad komponenten fortsat skal fungere sammen med. Der sendes hverken webstedsnavn, URL eller e-mail: installationen identificeres med et tilfældigt id, der ændres, hvis webstedets URL ændres. Sendes højst én gang om ugen efter en scanning, med kort timeout, og aldrig fra et websted, der ikke har sagt ja. Hele listen over det, der sendes, står i komponentens README."
COM_FOOTPRINT_CONFIG_STATS_CONSENT_LABEL="Del anonym statistik"
COM_FOOTPRINT_CONFIG_STATS_CONSENT_DESC="Omfatter versioner, diagnostiske indstillinger, målte størrelser og en liste over installerede udvidelser med deres versioner."
COM_FOOTPRINT_CONFIG_STATS_UNASKED="Ikke besvaret endnu"
