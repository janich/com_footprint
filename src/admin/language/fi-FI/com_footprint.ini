COM_FOOTPRINT_STATS_ASK_TITLE="Jaetaanko anonyymit tilastot?"
COM_FOOTPRINT_STATS_ASK_DESC="Footprint voi lähettää anonyymejä käyttötilastoja tekijälle kehityksen tueksi. Sivuston nimeä, URL-osoitetta tai sähköpostia ei lähetetä — asennus tunnistetaan satunnaisella tunnisteella. Mukana ovat Joomla-, PHP- ja tietokantaversiot, muutama diagnostiikka-asetus, komponentin mittaamat koot sekä luettelo asennetuista laajennuksista ja niiden versioista. Lähetetään enintään kerran viikossa skannauksen jälkeen. Voit muuttaa tätä myöhemmin asetuksista."
COM_FOOTPRINT_STATS_ASK_YES="Jaa anonyymit tilastot"
