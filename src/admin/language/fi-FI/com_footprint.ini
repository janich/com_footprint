COM_FOOTPRINT_STATS_THANKS="Kiitos — anonyymit tilastot jaetaan skannausten jälkeen, enintään kerran viikossa."
COM_FOOTPRINT_STATS_DECLINED="Tilastoja ei jaeta. Sinulta ei kysytä uudelleen."
COM_FOOTPRINT_CONFIG_STATS_LABEL="Tilastot"
COM_FOOTPRINT_CONFIG_STATS_NOTE="Anonyymit käyttötilastot auttavat päättämään, minkä kanssa komponentin on jatkossakin toimittava. Sivuston nimeä, URL-osoitetta tai sähköpostia ei lähetetä: asennus tunnistetaan satunnaisella tunnisteella, joka vaihtuu jos sivuston URL muuttuu. Lähetetään enintään kerran viikossa skannauksen jälkeen lyhyellä aikakatkaisulla, eikä koskaan sivustolta joka ei ole antanut lupaa. Koko luettelo on komponentin README-tiedostossa."
