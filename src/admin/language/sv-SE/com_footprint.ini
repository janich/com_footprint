COM_FOOTPRINT_STATS_ASK_TITLE="Dela anonym statistik?"
COM_FOOTPRINT_STATS_ASK_DESC="Footprint kan skicka anonym användningsstatistik till utvecklaren som stöd för vidareutvecklingen. Varken webbplatsnamn, URL eller e-post skickas — installationen identifieras med ett slumpmässigt id. Det omfattar dina Joomla-, PHP- och databasversioner, några diagnostiska inställningar, de storlekar komponenten mäter samt en lista över dina installerade tillägg och deras versioner. Skickas högst en gång i veckan efter en skanning. Du kan ändra detta senare under Inställningar."
COM_FOOTPRINT_STATS_ASK_YES="Dela anonym statistik"
COM_FOOTPRINT_STATS_ASK_NO="Nej tack"
COM_FOOTPRINT_STATS_THANKS="Tack — anonym statistik delas efter skanningar, högst en gång i veckan."
COM_FOOTPRINT_STATS_DECLINED="Ingen statistik delas. Du kommer inte att tillfrågas igen."
COM_FOOTPRINT_CONFIG_STATS_LABEL="Statistik"
COM_FOOTPRINT_CONFIG_STATS_NOTE="Anonym användningsstatistik hjälper till att avgöra vad komponenten måste fortsätta fungera med. Varken webbplatsnamn, URL eller e-post skickas: installationen identifieras med ett slumpmässigt id som ändras om webbplatsens URL ändras. Skickas högst en gång i veckan efter en skanning, med kort timeout, och aldrig från en webbplats som inte samtyckt. Hela listan finns i komponentens README."
COM_FOOTPRINT_CONFIG_STATS_CONSENT_LABEL="Dela anonym statistik"
COM_FOOTPRINT_CONFIG_STATS_CONSENT_DESC="Omfattar versioner, diagnostiska inställningar, uppmätta storlekar och en lista över installerade tillägg med versioner."
